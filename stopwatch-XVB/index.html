<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Stopwatch</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <h1 class="app-title">Online Stopwatch</h1>
      </header>

      <main class="app-main">
        <section class="view-window" aria-live="polite">
          <div class="view-track" data-view-track>
            <section class="view" data-view="countdown" aria-label="Countdown view">
              <div class="panel panel--single stopwatch-panel">
                <div class="countdown">
                  <div class="countdown__display" aria-live="off" data-countdown-display>
                    <div class="countdown__time" data-countdown-time>00:00:00</div>
                    <div class="countdown__milliseconds" data-countdown-milliseconds>000</div>
                  </div>

                  <div class="countdown__keypad" aria-label="Countdown keypad">
                    <div class="countdown__row">
                      <button class="countdown__button" type="button" data-countdown-digit="0">0</button>
                      <button class="countdown__button" type="button" data-countdown-digit="1">1</button>
                      <button class="countdown__button" type="button" data-countdown-digit="2">2</button>
                      <button class="countdown__button" type="button" data-countdown-digit="3">3</button>
                      <button class="countdown__button" type="button" data-countdown-digit="4">4</button>
                      <button
                        class="countdown__button countdown__button--wide countdown__button--set"
                        type="button"
                        data-countdown-set
                      >
                        Set
                      </button>
                    </div>

                    <div class="countdown__row">
                      <button class="countdown__button" type="button" data-countdown-digit="5">5</button>
                      <button class="countdown__button" type="button" data-countdown-digit="6">6</button>
                      <button class="countdown__button" type="button" data-countdown-digit="7">7</button>
                      <button class="countdown__button" type="button" data-countdown-digit="8">8</button>
                      <button class="countdown__button" type="button" data-countdown-digit="9">9</button>
                      <button
                        class="countdown__button countdown__button--wide countdown__button--clear"
                        type="button"
                        data-countdown-clear
                      >
                        Clear
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <section class="view" data-view="selection" aria-label="Mode selection view">
              <div class="selection-grid">
                <button class="mode-card" type="button" data-target-view="stopwatch" aria-label="Open stopwatch view">
                  <span class="mode-card__icon mode-card__icon--up" aria-hidden="true">↑</span>
                  <span class="mode-card__title">Stopwatch</span>
                  <span class="mode-card__description">Track elapsed time with a clean digital display.</span>
                </button>

                <button class="mode-card" type="button" data-target-view="countdown" aria-label="Open countdown view">
                  <span class="mode-card__icon mode-card__icon--down" aria-hidden="true">↓</span>
                  <span class="mode-card__title">Countdown</span>
                  <span class="mode-card__description">Prepare a reverse timer for focused sessions.</span>
                </button>
              </div>
            </section>

            <section class="view" data-view="stopwatch" aria-label="Stopwatch view">
              <div class="panel panel--single stopwatch-panel">
                <div class="stopwatch">
                  <div class="stopwatch__display" aria-live="off" data-stopwatch-display>
                    <div class="stopwatch__time" data-stopwatch-time>00:00:00</div>
                    <div class="stopwatch__milliseconds" data-stopwatch-milliseconds>000</div>
                  </div>

                  <div class="stopwatch__actions" data-stopwatch-actions>
                    <button
                      class="stopwatch__button stopwatch__button--primary"
                      type="button"
                      data-stopwatch-toggle
                      data-state="idle"
                    >
                      Start
                    </button>
                    <button
                      class="stopwatch__button stopwatch__button--clear"
                      type="button"
                      data-stopwatch-clear
                    >
                      Clear
                    </button>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </section>
      </main>

      <footer class="app-footer">
        <button class="back-button" type="button" data-back-button hidden>
          Back
        </button>
      </footer>
    </div>
  </body>
</html>
